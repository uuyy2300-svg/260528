<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meigongmeizi Carousel</title>
  
  <!-- 引入字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 和 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel 用于在浏览器中编译 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 添加缓缓跳动/呼吸的自定义动画 */
    @keyframes gentle-bounce {
      0%, 100% { 
        transform: translateY(0) scale(1); 
      }
      50% { 
        transform: translateY(-8px) scale(1.03); 
      }
    }
    .animate-gentle-bounce {
      animation: gentle-bounce 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // 替换为您提供的4个新图片链接，并搭配了同色系的沉浸式背景色
    // 您可以根据实际图片的视觉效果，微调 bg (背景) 的十六进制颜色值
    const IMAGES = [
      { src: 'https://github.com/uuyy2300-svg/202652412/blob/main/Group%206%2010.png?raw=true', bg: '#719C80', panel: '#9b8aa8' }, 
      { src: 'https://github.com/uuyy2300-svg/202652412/blob/main/Frame%20768591824%201.png?raw=true', bg: '#5F92A3', panel: '#d8968f' }, 
      { src: 'https://github.com/uuyy2300-svg/202652412/blob/main/Frame%20768591823%201.png?raw=true', bg: '#648284', panel: '#8aa6c3' }, 
      { src: 'https://github.com/uuyy2300-svg/202652412/blob/main/Frame%20192%201.png?raw=true', bg: '#68A18D', panel: '#9abbb4' }, 
    ];

    const GRAIN_URL = "data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E";

    // 音效生成函数 (生成可爱的“啵啵”气泡/果冻弹跳声)
    const playClickSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        
        // 尝试恢复音频上下文（针对浏览器的自动播放策略）
        if (ctx.state === 'suspended') {
            ctx.resume();
        }

        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();

        // 使用正弦波，声音圆润可爱
        osc.type = 'sine';
        
        // 频率快速上升，模拟可爱的“啵”气泡声或小跳跃声
        osc.frequency.setValueAtTime(250, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.12); 

        // 音量控制（快速出现，迅速消失，短促可爱）
        gainNode.gain.setValueAtTime(0, ctx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

        osc.connect(gainNode);
        gainNode.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio play failed:", e);
      }
    };

    function App() {
      const [activeIndex, setActiveIndex] = useState(0);
      const [isMobile, setIsMobile] = useState(false);
      const isAnimating = useRef(false);
      const hasInteractedRef = useRef(false); // 记录用户是否进行过交互

      // 预加载图片
      useEffect(() => {
        IMAGES.forEach((img) => {
          const image = new Image();
          image.src = img.src;
        });
      }, []);

      // 监听屏幕尺寸
      useEffect(() => {
        const handleResize = () => {
          setIsMobile(window.innerWidth < 640);
        };
        handleResize(); // 初始检查
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // 监听用户交互（解锁音频播放权限，否则现代浏览器会拦截自动播放的声音）
      useEffect(() => {
        const unlockAudio = () => {
          hasInteractedRef.current = true;
          document.removeEventListener('click', unlockAudio);
          document.removeEventListener('touchstart', unlockAudio);
        };
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);
        return () => {
          document.removeEventListener('click', unlockAudio);
          document.removeEventListener('touchstart', unlockAudio);
        };
      }, []);

      // 轮播导航逻辑
      const navigate = useCallback((direction) => {
        if (isAnimating.current) return;
        
        // 播放音效 (仅在用户交互后播放，防止浏览器报错)
        if (hasInteractedRef.current) {
          playClickSound();
        }

        isAnimating.current = true;
        setActiveIndex((prev) => {
          if (direction === 'next') {
            return (prev + 1) % 4;
          } else {
            return (prev + 3) % 4; // 等同于 -1
          }
        });

        setTimeout(() => {
          isAnimating.current = false;
        }, 650);
      }, []);

      // 自动轮播逻辑 (3秒一次自动切换)
      useEffect(() => {
        const interval = setInterval(() => {
          navigate('next');
        }, 3000); // 3000毫秒 = 3秒
        
        // 组件卸载时清除定时器
        return () => clearInterval(interval);
      }, [navigate]);

      // 获取各个角色的样式
      const getItemStyle = (index) => {
        const center = activeIndex;
        const left = (activeIndex + 3) % 4;
        const right = (activeIndex + 1) % 4;
        const back = (activeIndex + 2) % 4;

        let style = {
          transition: 'all 650ms cubic-bezier(0.4, 0, 0.2, 1)',
          transformOrigin: 'bottom center',
          aspectRatio: '0.6 / 1',
        };

        if (index === center) {
          style = {
            ...style,
            transform: `translateX(-50%) scale(${isMobile ? 1.25 : 1.68})`,
            filter: 'blur(0px)',
            opacity: 1,
            zIndex: 20,
            left: '50%',
            height: isMobile ? '60%' : '92%',
            bottom: isMobile ? '22%' : '0%', 
          };
        } else if (index === left) {
          style = {
            ...style,
            transform: 'translateX(-50%) scale(1)',
            filter: 'blur(2px)',
            opacity: 0.85,
            zIndex: 10,
            left: isMobile ? '20%' : '30%',
            height: isMobile ? '16%' : '28%',
            bottom: isMobile ? '32%' : '12%',
          };
        } else if (index === right) {
          style = {
            ...style,
            transform: 'translateX(-50%) scale(1)',
            filter: 'blur(2px)',
            opacity: 0.85,
            zIndex: 10,
            left: isMobile ? '80%' : '70%',
            height: isMobile ? '16%' : '28%',
            bottom: isMobile ? '32%' : '12%',
          };
        } else if (index === back) {
          style = {
            ...style,
            transform: 'translateX(-50%) scale(1)',
            filter: 'blur(4px)',
            opacity: 1,
            zIndex: 5,
            left: '50%',
            height: isMobile ? '13%' : '22%',
            bottom: isMobile ? '32%' : '12%',
          };
        }

        return style;
      };

      return (
        <div 
          className="relative w-full overflow-hidden transition-colors duration-[650ms] ease-[cubic-bezier(0.4,0,0.2,1)]"
          style={{ backgroundColor: IMAGES[activeIndex].bg, fontFamily: "'Inter', sans-serif" }}
        >
          <div className="relative w-full h-screen overflow-hidden">
            
            {/* 1. Grain overlay */}
            <div 
              className="absolute inset-0 pointer-events-none z-50 opacity-40"
              style={{ backgroundImage: `url("${GRAIN_URL}")`, backgroundSize: '200px 200px', backgroundRepeat: 'repeat' }}
            />

            {/* 2. Giant ghost text */}
            <div 
              className="absolute inset-x-0 flex items-center justify-center pointer-events-none select-none z-[2]"
              style={{ top: '18%' }}
            >
              <h1 
                className="text-white uppercase whitespace-nowrap"
                style={{ 
                  fontFamily: "'Anton', sans-serif", 
                  fontSize: 'clamp(90px, 28vw, 380px)', 
                  fontWeight: 900, 
                  lineHeight: 1, 
                  letterSpacing: '-0.02em',
                  opacity: 1 
                }}
              >
                UI DESIGN
              </h1>
            </div>

            {/* 3. Top-left brand label */}
            <div className="absolute top-6 left-4 sm:left-8 z-[60]">
              <img 
                src="https://github.com/uuyy2300-svg/260528/blob/main/Frame%20768591825.png?raw=true" 
                alt="Meigongmeizi Logo" 
                className="h-10 sm:h-12 lg:h-14 w-auto object-contain drop-shadow-md hover:scale-105 transition-transform duration-300"
              />
            </div>

            {/* 4. Carousel */}
            <div className="absolute inset-0 z-[3]">
              {IMAGES.map((img, index) => (
                <div 
                  key={index} 
                  className="absolute transition-all duration-[650ms] ease-[cubic-bezier(0.4,0,0.2,1)]"
                  style={getItemStyle(index)}
                >
                  <img 
                    src={img.src} 
                    alt={`Figurine ${index + 1}`} 
                    draggable="false"
                    className="w-full h-full object-contain object-bottom pointer-events-none select-none"
                  />
                </div>
              ))}
            </div>

            {/* 5. Bottom-left text + nav buttons */}
            <div className="absolute bottom-6 left-4 sm:bottom-20 sm:left-24 z-[60] max-w-[320px]">
              <p className="font-bold uppercase tracking-widest mb-2 sm:mb-3 text-base sm:text-[22px] text-white opacity-95" style={{ letterSpacing: '0.02em' }}>
                UI Designer
              </p>
              <p className="hidden sm:block text-xs sm:text-sm text-white opacity-85 leading-[1.6] mb-4 sm:mb-5">
               从业十余载自由 UI 设计师，擅长多终端及 IP 视觉设计
十年自由 UI 设计，深耕网页、大屏、触控、小程序与 IP 设计
资深自由 UI 设计师，精通全终端界面及 IP 形象设计工作
              </p>
              <div className="flex gap-4">
                <button 
                  onClick={() => navigate('prev')}
                  className="w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-transparent border-2 border-white flex items-center justify-center text-white transition-all duration-150 hover:scale-105 hover:bg-white/10 active:scale-95 cursor-pointer"
                  aria-label="Previous image"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                </button>
                <button 
                  onClick={() => navigate('next')}
                  className="w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-transparent border-2 border-white flex items-center justify-center text-white transition-all duration-150 hover:scale-105 hover:bg-white/10 active:scale-95 cursor-pointer"
                  aria-label="Next image"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
              </div>
            </div>

            {/* 6. Bottom-right link */}
            <div className="absolute bottom-6 right-4 sm:bottom-20 sm:right-10 z-[60] animate-gentle-bounce">
              <a 
                href="https://www.xiaohongshu.com/user/profile/5ecd1c05000000000101ec11" 
                target="_blank"
                rel="noopener noreferrer"
                className="flex items-center text-white opacity-95 hover:opacity-100 transition-opacity duration-200 uppercase no-underline group"
                style={{ fontFamily: "'Anton', sans-serif", fontSize: 'clamp(20px, 4vw, 56px)', letterSpacing: '-0.02em', lineHeight: 1 }}
              >
              Contact me
                <svg className="w-5 h-5 sm:w-8 sm:h-8 ml-2 sm:ml-4 transform group-hover:translate-x-1 transition-transform duration-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </a>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
